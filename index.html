<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#c2185b"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Little Muslim"/>
<title>Little Muslim Weekend Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Nunito',sans-serif;background:#1a0a2e}
:root{
  --pk:#ff6eb4;--pu:#ce93d8;--gd:#ffd54f;--gr:#4caf50;
  --card:#1e0d35;--card2:#2a1248;--brd:rgba(255,110,180,0.25);
  --shadow:0 4px 20px rgba(255,110,180,0.2);--r:18px;
}
body{background:linear-gradient(160deg,#2d0a4e 0%,#1a0a2e 40%,#3d0050 100%);color:#fff}
#sparkle-bg{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.spark{position:absolute;border-radius:50%;animation:twinkle var(--d,3s) var(--del,0s) infinite}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(0.5)}50%{opacity:1;transform:scale(1)}}
#confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.cf{position:absolute;border-radius:2px;animation:cffall 2s ease-in forwards}
@keyframes cffall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
#app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.header{
  background:linear-gradient(135deg,#4a148c 0%,#880e4f 50%,#c2185b 100%);
  padding:12px 12px 10px;
  padding-top:max(env(safe-area-inset-top,12px),12px);
  flex-shrink:0;position:relative;overflow:hidden;
}
.header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff6eb4,#ffd54f,#ce93d8,#ff6eb4)}
.hdr-top{display:flex;align-items:center;gap:8px}
.crown{font-size:1.8rem;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-5px) rotate(5deg)}}
.hdr-titles{flex:1}
.hdr-main{font-family:'Baloo 2',cursive;font-size:1.15rem;font-weight:800;color:#fff;text-shadow:0 0 20px rgba(255,110,180,0.8);line-height:1.1}
.hdr-sub{font-size:0.7rem;color:rgba(255,255,255,0.75);font-weight:700;margin-top:1px}
.name-wrap{display:flex;align-items:center;gap:6px;margin-top:8px}
.name-input{flex:1;background:rgba(255,255,255,0.12);border:1.5px solid rgba(255,110,180,0.5);border-radius:30px;padding:6px 14px;color:#fff;font-family:'Nunito',sans-serif;font-size:0.85rem;font-weight:700;outline:none}
.name-input::placeholder{color:rgba(255,255,255,0.45)}
.name-input:focus{border-color:#ff6eb4;background:rgba(255,255,255,0.18)}
.greet{font-size:0.88rem;font-weight:800;color:#ffd54f;text-shadow:0 0 10px rgba(255,213,79,0.5);margin-top:8px;display:none}
.hdr-bottom{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:6px}
.hdr-stars{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.6)}
.nav{display:flex;background:#150826;flex-shrink:0;border-bottom:1px solid var(--brd);overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{flex:1;min-width:72px;padding:10px 4px 8px;background:transparent;border:none;color:rgba(255,255,255,0.45);font-family:'Nunito',sans-serif;font-size:0.68rem;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;transition:color 0.2s}
.nav-btn .ico{font-size:1.15rem}
.nav-btn.active{color:#ff6eb4}
.nav-btn.active::after{content:'';position:absolute;bottom:0;left:15%;right:15%;height:2.5px;background:linear-gradient(90deg,#ff6eb4,#ffd54f);border-radius:3px}
.nav-btn:active{transform:scale(0.92)}
.content{flex:1;overflow-y:auto;padding:10px 10px 80px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
/* CARDS */
.card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
/* PROGRESS */
.prog-row{display:flex;justify-content:space-between;margin-bottom:6px}
.prog-lbl{font-size:0.78rem;font-weight:700;color:rgba(255,255,255,0.65)}
.prog-ct{font-size:0.78rem;font-weight:800;color:#ffd54f}
.prog-track{height:10px;background:rgba(255,255,255,0.1);border-radius:20px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#c2185b,#ff6eb4,#ffd54f);border-radius:20px;transition:width 0.5s cubic-bezier(.4,2,.6,1)}
.prog-msg{text-align:center;font-size:0.72rem;font-weight:700;color:#ce93d8;margin-top:5px}
/* ACTIVITY */
.act{background:var(--card);border:1px solid var(--brd);border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-left:4px solid transparent;transition:transform 0.15s}
.act:active{transform:scale(0.97)}
.act.done{opacity:0.42}
.act.done .act-title{text-decoration:line-through}
.t-prayer{border-left-color:#4caf50}.t-prayer .act-ico{background:rgba(76,175,80,0.2)}
.t-meal{border-left-color:#ff9800}.t-meal .act-ico{background:rgba(255,152,0,0.2)}
.t-learn{border-left-color:#90caf9}.t-learn .act-ico{background:rgba(144,202,249,0.2)}
.t-play{border-left-color:#ce93d8}.t-play .act-ico{background:rgba(206,147,216,0.2)}
.t-family{border-left-color:#ff6eb4}.t-family .act-ico{background:rgba(255,110,180,0.2)}
.t-sleep{border-left-color:#90a4ae}.t-sleep .act-ico{background:rgba(144,164,174,0.2)}
.act-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.act-info{flex:1;min-width:0}
.act-time{font-size:0.68rem;font-weight:700;color:rgba(255,255,255,0.4);margin-bottom:1px}
.act-title{font-size:0.88rem;font-weight:800;color:#fff;line-height:1.2}
.act-desc{font-size:0.72rem;color:rgba(255,255,255,0.48);margin-top:2px}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;background:transparent}
.chk.on{background:linear-gradient(135deg,#c2185b,#ff6eb4);border-color:#ff6eb4;box-shadow:0 0 10px rgba(255,110,180,0.5)}
.chk svg{display:none}.chk.on svg{display:block}
/* REWARDS */
.gem-box{background:linear-gradient(135deg,#4a148c,#880e4f);border:1px solid #ff6eb4;border-radius:var(--r);padding:14px;text-align:center;margin-bottom:10px;box-shadow:0 0 30px rgba(255,110,180,0.3)}
.gem-num{font-family:'Baloo 2',cursive;font-size:3rem;font-weight:800;color:#ffd54f;text-shadow:0 0 20px rgba(255,213,79,0.7);line-height:1}
.gem-lbl{font-size:0.75rem;font-weight:800;color:#ff6eb4;letter-spacing:1px;margin-top:2px}
.day-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.day-pill{background:var(--card2);border:1px solid var(--brd);border-radius:12px;padding:10px;text-align:center}
.dp-num{font-size:1.4rem;font-weight:800;color:#ffd54f}
.dp-lbl{font-size:0.7rem;font-weight:700;color:#ce93d8}
.sec-ttl{font-family:'Baloo 2',cursive;font-size:1rem;font-weight:700;color:#ce93d8;margin-bottom:8px}
.rwrd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rwrd-card{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:12px 10px;text-align:center}
.rwrd-ico{font-size:1.4rem;margin-bottom:4px}
.rwrd-name{font-size:0.75rem;font-weight:800;color:#fff;margin-bottom:6px;line-height:1.2}
.day-lbl{font-size:0.65rem;font-weight:700;color:#ce93d8;margin:4px 0 3px}
.star-row{display:flex;justify-content:center;gap:3px}
.star-btn{width:32px;height:32px;cursor:pointer;background:none;border:none;padding:2px;display:flex;align-items:center;justify-content:center}
.star-btn:active{transform:scale(1.3)}
.ri-box{border:1px solid rgba(255,213,79,0.3);border-radius:14px;padding:12px;background:rgba(255,213,79,0.05);margin-top:10px}
.ri-title{font-size:0.8rem;font-weight:800;color:#ffd54f;margin-bottom:7px}
.ri-chips{display:flex;flex-wrap:wrap;gap:5px}
.ri-chip{background:rgba(255,110,180,0.15);border:1px solid rgba(255,110,180,0.3);border-radius:20px;padding:4px 10px;font-size:0.73rem;font-weight:700;color:#ff6eb4}
/* DUAS */
.dua-card{background:var(--card);border:1px solid rgba(76,175,80,0.3);border-radius:var(--r);padding:16px;margin-bottom:10px;text-align:center}
.dua-name{font-size:0.8rem;font-weight:800;color:#a5d6a7;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.dua-arabic{font-size:1.3rem;color:#ffd54f;font-weight:700;line-height:1.9;direction:rtl;margin-bottom:8px}
.dua-eng{font-size:0.78rem;color:rgba(255,255,255,0.55);font-style:italic;line-height:1.5}
/* REMINDERS */
.rem-card{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.rem-ico{font-size:1.4rem}
.rem-txt{font-size:0.88rem;font-weight:700;color:#fff}
.parent-tip{background:linear-gradient(135deg,rgba(74,20,140,0.6),rgba(136,14,79,0.6));border:1px solid rgba(255,110,180,0.4);border-radius:14px;padding:14px;margin-top:4px}
.pt-title{font-size:0.82rem;font-weight:800;color:#ffd54f;margin-bottom:6px}
.pt-body{font-size:0.78rem;color:rgba(255,255,255,0.75);line-height:1.6}
.pt-love{font-size:0.82rem;font-weight:800;color:#ff6eb4;margin-top:8px}
.credit{text-align:center;font-size:0.7rem;color:rgba(255,255,255,0.25);margin-top:12px;font-weight:600}
.credit span{color:rgba(255,110,180,0.6)}
.reset-btn{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.55);border-radius:30px;padding:8px 18px;font-family:'Nunito',sans-serif;font-size:0.8rem;font-weight:700;cursor:pointer;display:block;margin:12px auto 0}
.reset-btn:active{transform:scale(0.95)}
.install-box{background:rgba(255,110,180,0.08);border:1px solid rgba(255,110,180,0.2);border-radius:14px;padding:12px;margin-top:10px}
.install-title{font-size:0.8rem;font-weight:800;color:#ff6eb4;margin-bottom:6px}
.install-body{font-size:0.75rem;color:rgba(255,255,255,0.6);line-height:1.6}
</style>
</head>
<body>
<div id="sparkle-bg"></div>
<div id="confetti"></div>
<div id="app">
  <div class="header">
    <div class="hdr-top">
      <div class="crown">👑</div>
      <div class="hdr-titles">
        <div class="hdr-main">Weekend Schedule<br>for Little Muslims 🌙</div>
        <div class="hdr-sub">Age 4–7 · Malaysia Time · By RedzuanBaharan</div>
      </div>
    </div>
    <div class="name-wrap" id="nameWrap">
      <input class="name-input" id="nameInput" type="text" maxlength="20" placeholder="✨ Enter your name, princess!" autocomplete="off"/>
    </div>
    <div class="greet" id="greet"></div>
    <div class="hdr-bottom">
      <span style="font-size:0.9rem">💫</span>
      <span class="hdr-stars" id="hdrStars">0 stars earned</span>
      <span style="font-size:0.9rem">💫</span>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="content" id="content"></div>
</div>

<script>
const ACTS=[
  {time:'7:00 AM',title:'Wake Up & Morning Du\'a',desc:'Say morning dua and start the day with gratitude!',ico:'🌅',type:'prayer'},
  {time:'7:30 AM',title:'Wudhu Practice',desc:'Learn and practice wudhu step by step.',ico:'💧',type:'learn'},
  {time:'8:00 AM',title:'Fajr Prayer with Family',desc:'Pray Fajr with family and make dua together.',ico:'🕌',type:'prayer'},
  {time:'8:30 AM',title:'Healthy Breakfast',desc:'Eat healthy food and say "Bismillah".',ico:'🥗',type:'meal'},
  {time:'9:00 AM',title:'Do Homework',desc:'Complete your homework and try your best!',ico:'📚',type:'learn'},
  {time:'9:30 AM',title:'Islamic Story Time',desc:'Listen to Prophet stories and learn good values.',ico:'📖',type:'learn'},
  {time:'10:30 AM',title:'Educational Screen Time',desc:'Watch Islamic cartoons or videos with good lessons.',ico:'📱',type:'play'},
  {time:'1:15 PM',title:'Dhuhr Prayer',desc:'Pray Dhuhr and earn reward stars!',ico:'🕌',type:'prayer'},
  {time:'1:30 PM',title:'Lunch + Rest Time',desc:'Eat, relax and take a good rest.',ico:'🍽️',type:'meal'},
  {time:'3:00 PM',title:'Creative Learning',desc:'Do fun activities like colouring, crafts and drawing.',ico:'🎨',type:'play'},
  {time:'4:30 PM',title:'Asr Prayer',desc:'Pray Asr and ask Allah for goodness.',ico:'🕌',type:'prayer'},
  {time:'5:00 PM',title:'Outdoor Play',desc:'Play outside, be active and enjoy nature!',ico:'⚽',type:'play'},
  {time:'5:30 PM',title:'Helping Parents',desc:'Help at home and make parents happy.',ico:'🏠',type:'family'},
  {time:'7:20 PM',title:'Maghrib Prayer',desc:'Pray Maghrib with family.',ico:'🌆',type:'prayer'},
  {time:'7:45 PM',title:'Surah Revision',desc:'Revise surahs using fun games.',ico:'📗',type:'learn'},
  {time:'8:15 PM',title:'Dinner',desc:'Eat dinner and say Alhamdulillah.',ico:'🍛',type:'meal'},
  {time:'10:00 PM',title:'Study',desc:'Study and revise lessons or do reading.',ico:'🔬',type:'learn'},
  {time:'10:00 PM',title:'Bedtime Story + Du\'a',desc:'Listen to a bedtime story and sleep with dua.',ico:'🌙',type:'sleep'},
];
const TASKS=[
  {name:'Prayed on time',ico:'🕌'},
  {name:'Read Quran',ico:'📗'},
  {name:'Helped Parents',ico:'🏠'},
  {name:'Good Manners',ico:'😊'},
  {name:'No Screentime Tantrums',ico:'📵'},
];
const DUAS=[
  {name:'Morning Dua',arabic:'الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا',eng:'All praise is due to Allah who gave us life after death (sleep).'},
  {name:'Before Eating – Bismillah',arabic:'بِسْمِ اللَّهِ',eng:'In the name of Allah.'},
  {name:'After Eating',arabic:'الْحَمْدُ لِلَّهِ',eng:'All praise is due to Allah.'},
  {name:'Before Sleep',arabic:'اللَّهُمَّ بِاسْمِكَ أَمُوتُ وَأَحْيَا',eng:'O Allah, with Your name I die and I live.'},
  {name:'Entering Bathroom',arabic:'اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْخُبُثِ وَالْخَبَائِثِ',eng:'O Allah, I seek refuge in You from evil.'},
  {name:'Entering Home',arabic:'اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ الْمَوْلِجِ وَخَيْرَ الْمَخْرَجِ',eng:'O Allah, I ask You for the best of entries and exits.'},
];
const REMS=[
  {ico:'🤲',txt:'Say Bismillah before everything'},
  {ico:'❤️',txt:'Be Kind and Share with others'},
  {ico:'👂',txt:'Listen to Parents always'},
  {ico:'🕐',txt:'Pray on time every day'},
  {ico:'🙏',txt:'Thank Allah for everything'},
];
const TABS=[
  {id:'schedule',ico:'📅',lbl:'Schedule'},
  {id:'rewards',ico:'⭐',lbl:'Rewards'},
  {id:'duas',ico:'🤲',lbl:'Du\'as'},
  {id:'tips',ico:'💡',lbl:'Reminders'},
];

// STATE
let S={name:'',done:[],stars:TASKS.map(()=>({sat:0,sun:0})),tab:'schedule'};
try{const s=JSON.parse(localStorage.getItem('lm_v3'));if(s)Object.assign(S,s);}catch(e){}
const save=()=>localStorage.setItem('lm_v3',JSON.stringify(S));

// SPARKLES
(function(){
  const bg=document.getElementById('sparkle-bg');
  const cols=['#ff6eb4','#ffd54f','#ce93d8','#90caf9','#fff'];
  for(let i=0;i<55;i++){
    const el=document.createElement('div');el.className='spark';
    const sz=1+Math.random()*3;
    el.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${cols[Math.floor(Math.random()*cols.length)]};--d:${2+Math.random()*4}s;--del:${Math.random()*4}s`;
    bg.appendChild(el);
  }
})();

// AUDIO
const AC=new(window.AudioContext||window.webkitAudioContext)();
const resume=()=>{if(AC.state==='suspended')AC.resume()};
function tone(f,type,dur,vol,delay){
  resume();
  const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,AC.currentTime+delay);
  g.gain.linearRampToValueAtTime(vol,AC.currentTime+delay+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+delay+dur);
  o.start(AC.currentTime+delay);o.stop(AC.currentTime+delay+dur+0.05);
}
const sfx={
  check:()=>{tone(523,'sine',0.1,0.3,0);tone(659,'sine',0.1,0.3,0.08);tone(784,'sine',0.15,0.3,0.16)},
  uncheck:()=>tone(350,'sine',0.12,0.18,0),
  star:()=>[523,659,784,1047].forEach((f,i)=>tone(f,'sine',0.12,0.25,i*0.07)),
  fanfare:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,'square',0.12,0.2,i*0.1)),
  tab:()=>tone(440,'sine',0.07,0.12,0),
  name:()=>[659,784,1047].forEach((f,i)=>tone(f,'sine',0.1,0.2,i*0.08)),
};

// CONFETTI
function confetti(n=40){
  const c=document.getElementById('confetti');
  const cols=['#ff6eb4','#ffd54f','#ce93d8','#90caf9','#4caf50','#ff9800','#fff'];
  for(let i=0;i<n;i++){
    const el=document.createElement('div');el.className='cf';
    const sz=6+Math.random()*10;
    el.style.cssText=`left:${Math.random()*100}%;top:-20px;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};animation-delay:${Math.random()*0.8}s`;
    c.appendChild(el);setTimeout(()=>el.remove(),3000);
  }
}

// HELPERS
const totalStars=()=>S.stars.reduce((a,t)=>a+t.sat+t.sun,0);
function updateHeader(){
  document.getElementById('hdrStars').textContent=totalStars()+' stars earned';
  const nw=document.getElementById('nameWrap');
  const gr=document.getElementById('greet');
  if(S.name){
    nw.style.display='none';gr.style.display='block';
    gr.textContent='👸 Assalamualaikum, Princess '+S.name+'! 💕';
  } else {
    nw.style.display='flex';gr.style.display='none';
  }
}

// NAME
document.getElementById('nameInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.value.trim()){S.name=e.target.value.trim();save();sfx.name();confetti(20);updateHeader();}
});
document.getElementById('nameInput').addEventListener('blur',e=>{
  if(e.target.value.trim()){S.name=e.target.value.trim();save();sfx.name();updateHeader();}
});

// NAV
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`
    <button class="nav-btn ${S.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">
      <span class="ico">${t.ico}</span><span>${t.lbl}</span>
    </button>`).join('');
}
function switchTab(id){sfx.tab();S.tab=id;renderNav();render();document.getElementById('content').scrollTop=0;}

// RENDER
function render(){
  const c=document.getElementById('content');
  if(S.tab==='schedule')c.innerHTML=renderSchedule();
  else if(S.tab==='rewards')c.innerHTML=renderRewards();
  else if(S.tab==='duas')c.innerHTML=renderDuas();
  else c.innerHTML=renderReminders();
}

function renderSchedule(){
  const pct=ACTS.length?Math.round(S.done.length/ACTS.length*100):0;
  const msgs=['Start with Bismillah! 🌅','Alhamdulillah, keep going! 💪','More than halfway! MashaAllah! 🌟','Almost there! Amazing! ✨','🎉 All done! SubhanAllah! You\'re a star!'];
  const mi=pct===100?4:pct>=75?3:pct>=50?2:pct>=25?1:0;
  return `<div class="card">
    <div class="prog-row"><span class="prog-lbl">Today's journey ✨</span><span class="prog-ct">${S.done.length}/${ACTS.length}</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="prog-msg">${msgs[mi]}</div>
  </div>`+ACTS.map((a,i)=>{
    const d=S.done.includes(i);
    return `<div class="act t-${a.type} ${d?'done':''}" onclick="toggleDone(${i})">
      <div class="act-ico">${a.ico}</div>
      <div class="act-info">
        <div class="act-time">${a.time}</div>
        <div class="act-title">${a.title}</div>
        <div class="act-desc">${a.desc}</div>
      </div>
      <div class="chk ${d?'on':''}">
        <svg width="14" height="14" viewBox="0 0 14 14"><polyline points="2,7 6,11 12,3" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      </div>
    </div>`;
  }).join('');
}

function toggleDone(i){
  resume();
  if(S.done.includes(i)){S.done=S.done.filter(x=>x!==i);sfx.uncheck();}
  else{S.done.push(i);sfx.check();if(S.done.length===ACTS.length)setTimeout(()=>{confetti(60);sfx.fanfare()},100);}
  save();updateHeader();render();
}

function renderRewards(){
  const satT=S.stars.reduce((a,t)=>a+t.sat,0);
  const sunT=S.stars.reduce((a,t)=>a+t.sun,0);
  return `<div class="gem-box"><div class="gem-num">${satT+sunT} ⭐</div><div class="gem-lbl">Stars Earned This Weekend!</div></div>
  <div class="day-grid">
    <div class="day-pill"><div class="dp-num">⭐ ${satT}</div><div class="dp-lbl">Saturday Stars</div></div>
    <div class="day-pill"><div class="dp-num">⭐ ${sunT}</div><div class="dp-lbl">Sunday Stars</div></div>
  </div>
  <div class="sec-ttl">Tap a star to earn it! 👇</div>
  <div class="rwrd-grid">${S.stars.map((t,i)=>{
    const tk=TASKS[i];
    const starSvg=(filled)=>`<svg viewBox="0 0 24 24" width="28" height="28"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9" fill="${filled?'#ffd54f':'rgba(255,255,255,0.1)'}" stroke="${filled?'#ff8f00':'rgba(255,255,255,0.15)'}" stroke-width="1.5"/></svg>`;
    return `<div class="rwrd-card">
      <div class="rwrd-ico">${tk.ico}</div>
      <div class="rwrd-name">${tk.name}</div>
      <div class="day-lbl">Saturday</div>
      <div class="star-row"><button class="star-btn" onclick="toggleStar(${i},'sat')">${starSvg(t.sat>0)}</button></div>
      <div class="day-lbl">Sunday</div>
      <div class="star-row"><button class="star-btn" onclick="toggleStar(${i},'sun')">${starSvg(t.sun>0)}</button></div>
    </div>`;
  }).join('')}</div>
  <div class="ri-box"><div class="ri-title">🎁 Reward Ideas</div><div class="ri-chips">${['⚽ Extra play time','🍩 Favourite snack','📚 New book','⭐ Sticker','🚗 Family outing'].map(r=>`<span class="ri-chip">${r}</span>`).join('')}</div></div>
  <button class="reset-btn" onclick="resetAll()">🔄 Reset All Progress</button>
  <div class="credit" style="margin-top:14px">App by <span>RedzuanBaharan</span> · EnviroVera 🌿</div>`;
}

function toggleStar(i,day){
  resume();
  S.stars[i][day]=S.stars[i][day]>0?0:1;
  if(S.stars[i][day]>0){sfx.star();confetti(15);}else sfx.uncheck();
  save();updateHeader();render();
}

function renderDuas(){
  return `<div style="text-align:center;font-size:2rem;margin-bottom:10px">🤲🌙📿</div>`+
  DUAS.map(d=>`<div class="dua-card"><div class="dua-name">${d.name}</div><div class="dua-arabic">${d.arabic}</div><div class="dua-eng">"${d.eng}"</div></div>`).join('')+
  `<div style="background:rgba(76,175,80,0.1);border:1px solid rgba(76,175,80,0.3);border-radius:14px;padding:12px;text-align:center">
    <div style="font-size:0.82rem;font-weight:700;color:#a5d6a7">May Allah make our children among the righteous. Ameen 🤲</div>
  </div>
  <div class="credit" style="margin-top:14px">App by <span>RedzuanBaharan</span> · EnviroVera 🌿</div>`;
}

function renderReminders(){
  return `<div style="text-align:center;font-size:2rem;margin-bottom:10px">😊💚🌟</div>
  <div class="sec-ttl">Daily Reminders</div>`+
  REMS.map(r=>`<div class="rem-card"><div class="rem-ico">${r.ico}</div><div class="rem-txt">${r.txt}</div></div>`).join('')+
  `<div class="parent-tip">
    <div class="pt-title">💡 Parent Tip</div>
    <div class="pt-body">Keep it short, fun and consistent. Praise more, correct gently and make Islam a joyful part of their life.</div>
    <div class="pt-love">LOVE + CONSISTENCY = HAPPY LITTLE MUSLIM ❤️</div>
  </div>
  <div class="install-box">
    <div class="install-title">📲 Install this App on Phone</div>
    <div class="install-body"><strong style="color:#fff">iPhone:</strong> Tap Share button → "Add to Home Screen"<br><strong style="color:#fff">Android:</strong> Tap 3-dot menu → "Add to Home Screen"</div>
  </div>
  <div class="credit" style="margin-top:14px">App by <span>RedzuanBaharan</span> · EnviroVera 🌿</div>`;
}

function resetAll(){
  if(confirm('Reset all progress? Stars and checkmarks will be cleared.')){
    S.done=[];S.stars=TASKS.map(()=>({sat:0,sun:0}));save();render();updateHeader();
  }
}

// INIT
updateHeader();renderNav();render();
</script>
</body>
</html>
